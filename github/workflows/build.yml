name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. HARUS PALING ATAS: Mengambil/men-download file dari repository Anda dulu
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Baru setelah itu setup Java & cache Gradle
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    # 3. Memberikan izin eksekusi pada Gradle wrapper
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Menjalankan proses Build Debug APK
    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    # 5. Menyimpan file APK hasil build
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
        
