name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    # Menggunakan OS runner versi terbaru yang stabil
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. Menentukan Versi Java (JDK 17 adalah standar wajib untuk Android Studio modern)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    # 2. Memberikan izin eksekusi pada Gradle wrapper
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 3. Menjalankan proses Build Debug APK menggunakan Gradle
    - name: Build APK with Gradle
      run: ./gradlew assembleDebug

    # 4. Menyimpan file APK hasil build agar bisa di-download lewat tab Actions
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
